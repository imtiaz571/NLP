    <path d="M 315 395 Q 365 375 415 395" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M 465 395 Q 515 375 565 395" stroke="#cbd5e1" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 330 435 Q 365 415 400 435" stroke="#4c1d95" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M 480 435 Q 515 415 550 435" stroke="#4c1d95" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 385 570 Q 440 610 495 570" stroke="#701a75" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="335" cy="485" rx="35" ry="18" fill="#f43f5e" opacity="0.25"/>

