    <linearGradient id="skinTab" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffedd5"/><stop offset="50%" stop-color="#fed7aa"/><stop offset="100%" stop-color="#e2b18a"/></linearGradient>
    <linearGradient id="robeTab" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#581c87"/><stop offset="50%" stop-color="#3b0764"/><stop offset="100%" stop-color="#1e0238"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/></filter>
  </defs>

  <circle cx="500" cy="400" r="380" fill="url(#rimTab)"/>

