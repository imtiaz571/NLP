    <path d="M 330 445 Q 365 420 400 445" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none"/><path d="M 480 445 Q 515 420 550 445" stroke="#451a03" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 370 545 Q 440 615 510 545 Q 440 635 370 545 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="4"/><path d="M 385 550 L 430 550 L 430 565 L 385 550 Z" fill="#ffffff"/><path d="M 450 550 L 495 550 L 495 565 L 450 550 Z" fill="#ffffff"/>
    <ellipse cx="330" cy="495" rx="38" ry="22" fill="#fb7185" opacity="0.45"/> <ellipse cx="550" cy="495" rx="38" ry="22" fill="#fb7185" opacity="0.45"/>

