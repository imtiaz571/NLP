<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%">
  <defs>
    <radialGradient id="aura_mara_cole_surprised" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad_mara_cole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="skinGrad_mara_cole" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <filter id="glow_mara_cole">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Aura -->
  <circle cx="210" cy="230" r="190" fill="url(#aura_mara_cole_surprised)"/>

  <!-- Character Silhouette / Base Shadow -->
  <g filter="drop-shadow(0 15px 25px rgba(0,0,0,0.65))">
    
    <!-- Torso / Cloak / Garments -->
    <path d="M 80 540 C 90 410 110 340 140 310 Q 210 335 280 310 C 310 340 330 410 340 540 Z" fill="url(#bodyGrad_mara_cole)"/>
    
    <!-- Inner Tunic & Trim Details -->
    <path d="M 160 320 L 210 420 L 260 320 Z" fill="#10b981" opacity="0.85"/>
    <path d="M 140 310 L 210 440 L 280 310" stroke="#34d399" stroke-width="3" fill="none"/>
    <line x1="210" y1="420" x2="210" y2="540" stroke="#34d399" stroke-width="3"/>

    <!-- Neck -->
    <rect x="190" y="240" width="40" height="70" rx="8" fill="url(#skinGrad_mara_cole)"/>

    <!-- Back Hair -->
    <path d="M 130 160 Q 210 90 290 160 Q 310 270 295 340 Q 210 370 125 340 Q 110 270 130 160 Z" fill="#78350f"/>

    <!-- Head / Face -->
    <ellipse cx="210" cy="205" rx="55" ry="68" fill="url(#skinGrad_mara_cole)"/>
    <!-- Chin -->
    <path d="M 160 210 Q 210 280 260 210 Z" fill="url(#skinGrad_mara_cole)"/>

    <!-- Ears -->
    <ellipse cx="152" cy="205" rx="8" ry="14" fill="url(#skinGrad_mara_cole)"/>
    <ellipse cx="268" cy="205" rx="8" ry="14" fill="url(#skinGrad_mara_cole)"/>

    <!-- Front Hair / Bangs -->
    <path d="M 145 170 Q 210 110 275 170 Q 260 140 210 135 Q 160 140 145 170 Z" fill="#78350f"/>
    <path d="M 150 165 Q 170 210 160 240 Q 185 180 190 160 Z" fill="#78350f"/>
    <path d="M 270 165 Q 250 210 260 240 Q 235 180 230 160 Z" fill="#78350f"/>

    <!-- Character Specific Accessories/Gear -->
    
        <!-- Herbalist Circlet & Botanical Brooch -->
        <path d="M 140 135 Q 210 110 280 135" stroke="#34d399" stroke-width="4" fill="none"/>
        <circle cx="210" cy="120" r="8" fill="#34d399"/>
        <path d="M 210 108 Q 200 95 210 85 Q 220 95 210 108" fill="#4ade80"/>
        <path d="M 205 120 Q 190 120 185 110 Q 195 105 205 120" fill="#4ade80"/>
        <path d="M 215 120 Q 230 120 235 110 Q 225 105 215 120" fill="#4ade80"/>
        

    <!-- Facial Features -->
    <!-- Eyebrows -->
    <path d="M 160 155 Q 185 150 200 155" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 220 155 Q 235 150 260 155" stroke="#78350f" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <circle cx='180' cy='188' r='13' fill='#059669'/><circle cx='183' cy='184' r='5' fill='#ffffff'/>
    <circle cx='240' cy='188' r='13' fill='#059669'/><circle cx='243' cy='184' r='5' fill='#ffffff'/>

    <!-- Nose -->
    <path d="M 210 195 L 206 218 L 214 218" stroke="#a16207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

    <!-- Mouth -->
    <path d="M 200 238 Q 210 232 220 238 Q 220 252 210 252 Q 200 252 200 238 Z" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#b91c1c" opacity="0.85"/>

    <!-- Emotion Visual FX -->
    <path d='M 140 145 L 130 135 M 280 145 L 290 135' stroke='#34d399' stroke-width='3' stroke-linecap='round'/>
  </g>
</svg>