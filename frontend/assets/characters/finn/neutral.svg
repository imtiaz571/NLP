<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" width="880" height="1280">
  <defs>
    <radialGradient id="rimGlow" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe4cb"/>
      <stop offset="50%" stop-color="#fcd0aa"/>
      <stop offset="100%" stop-color="#e8a774"/>
    </linearGradient>
    <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd0aa"/>
      <stop offset="100%" stop-color="#c27847"/>
    </linearGradient>
    <linearGradient id="hairBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="40%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#270e02"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="irisGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
    <linearGradient id="tunicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d7c0f"/>
      <stop offset="50%" stop-color="#365314"/>
      <stop offset="100%" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#713f12"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Ambient Rim Glow -->
  <circle cx="500" cy="400" r="380" fill="url(#rimGlow)"/>

  <!-- Character Group with Drop Shadow -->
  <g filter="url(#drop)">

    <!-- Shoulders & Scout Tunic -->
    <path d="M 120 1280 C 140 1000 200 840 280 760 Q 440 800 600 760 C 680 840 740 1000 760 1280 Z" fill="url(#tunicGrad)"/>
    
    <!-- Tunic Collar Opening & Inner Shirt -->
    <path d="M 360 760 L 440 920 L 520 760 Z" fill="#d7ba89"/>
    <path d="M 380 760 L 440 880 L 500 760 Z" fill="#bfa06f"/>

    <!-- Leather Scout Harness & Straps -->
    <!-- Diagonal Quiver / Scout Strap -->
    <path d="M 240 780 L 640 1280 L 580 1280 L 180 780 Z" fill="url(#leatherGrad)"/>
    <path d="M 235 775 L 645 1285" stroke="#ca8a04" stroke-width="3" stroke-dasharray="8 6"/>
    <!-- Brass Buckle on Chest -->
    <rect x="390" y="940" width="100" height="50" rx="8" fill="#ca8a04" stroke="#eab308" stroke-width="4"/>
    <rect x="410" y="952" width="60" height="26" rx="4" fill="#713f12"/>
    <rect x="435" y="945" width="10" height="40" fill="#fef08a"/>

    <!-- Shoulder Pads / Leather Guards -->
    <path d="M 160 880 Q 220 780 300 770 Q 260 880 200 960 Z" fill="url(#leatherGrad)"/>
    <path d="M 720 880 Q 660 780 580 770 Q 620 880 680 960 Z" fill="url(#leatherGrad)"/>

    <!-- Strong Youthful Neck -->
    <path d="M 370 600 L 370 780 Q 440 820 510 780 L 510 600 Z" fill="url(#skinShadow)"/>
    <path d="M 390 600 L 390 760 Q 440 790 490 760 L 490 600 Z" fill="url(#skinBase)"/>

    <!-- Back Volume Hair -->
    <path d="M 220 380 Q 440 180 660 380 Q 720 620 660 760 Q 440 820 220 760 Q 160 620 220 380 Z" fill="url(#hairBase)"/>

    <!-- Head & Face Structure -->
    <!-- Jaw and Chin Contour -->
    <path d="M 280 440 C 280 640 360 730 440 730 C 520 730 600 640 600 440 C 600 300 520 250 440 250 C 360 250 280 300 280 440 Z" fill="url(#skinBase)"/>
    <!-- Shadow along jawline -->
    <path d="M 300 480 C 300 630 370 710 440 710 C 510 710 580 630 580 480 Q 560 650 440 680 Q 320 650 300 480 Z" fill="#c27847" opacity="0.45"/>

    <!-- Realistic Ears -->
    <path d="M 270 430 Q 250 470 270 510 Q 285 530 295 490 Z" fill="url(#skinBase)"/>
    <path d="M 610 430 Q 630 470 610 510 Q 595 530 585 490 Z" fill="url(#skinBase)"/>

    <!-- Nose Anatomy -->
    <path d="M 435 435 Q 430 495 425 510 Q 440 520 455 510 Q 450 495 445 435 Z" fill="url(#skinShadow)" opacity="0.6"/>
    <ellipse cx="440" cy="505" rx="14" ry="8" fill="url(#skinBase)"/>
    <circle cx="428" cy="510" r="3.5" fill="#5c2c16"/>
    <circle cx="452" cy="510" r="3.5" fill="#5c2c16"/>
    <!-- Nose Highlight -->
    <ellipse cx="440" cy="495" rx="4" ry="8" fill="#ffffff" opacity="0.55"/>

    <!-- Youthful Freckles -->
    <g fill="#9a3412" opacity="0.65">
      <circle cx="380" cy="485" r="2.2"/>
      <circle cx="395" cy="492" r="1.8"/>
      <circle cx="410" cy="498" r="2.4"/>
      <circle cx="470" cy="498" r="2.4"/>
      <circle cx="485" cy="492" r="1.8"/>
      <circle cx="500" cy="485" r="2.2"/>
      <circle cx="365" cy="495" r="1.6"/>
      <circle cx="515" cy="495" r="1.6"/>
    </g>

    <!-- Dynamic Emotion Features (Brows, Eyes, Mouth, FX) -->
    
        <path d="M 315 390 Q 365 370 415 390" stroke="#5c2c16" stroke-width="7" stroke-linecap="round" fill="none"/>
        <path d="M 465 390 Q 515 370 565 390" stroke="#5c2c16" stroke-width="7" stroke-linecap="round" fill="none"/>
        
    
        <!-- Left Eye (Alert Confident) -->
        <path d="M 325 435 Q 365 410 405 435 Q 365 460 325 435 Z" fill="#ffffff" stroke="#3b1d11" stroke-width="4"/>
        <circle cx="365" cy="435" r="17" fill="url(#irisGrad)"/>
        <circle cx="365" cy="435" r="7.5" fill="#000000"/>
        <circle cx="360" cy="428" r="5" fill="#ffffff"/>
        <circle cx="370" cy="440" r="2.5" fill="#ffffff"/>
        <!-- Right Eye (Alert Confident) -->
        <path d="M 475 435 Q 515 410 555 435 Q 515 460 475 435 Z" fill="#ffffff" stroke="#3b1d11" stroke-width="4"/>
        <circle cx="515" cy="435" r="17" fill="url(#irisGrad)"/>
        <circle cx="515" cy="435" r="7.5" fill="#000000"/>
        <circle cx="510" cy="428" r="5" fill="#ffffff"/>
        <circle cx="520" cy="440" r="2.5" fill="#ffffff"/>
        
    
        <!-- Confident Boyish Half-Smile -->
        <path d="M 390 555 Q 440 570 490 550" stroke="#881337" stroke-width="5" stroke-linecap="round" fill="none"/>
        
    

    <!-- Tousled Windswept Scout Hair (Front Layers) -->
    <!-- Top & Bangs -->
    <path d="M 260 380 Q 440 160 620 380 Q 560 280 440 270 Q 320 280 260 380 Z" fill="url(#hairHighlight)"/>
    <!-- Windswept Tufts & Spikes -->
    <path d="M 440 270 Q 470 200 520 220 Q 480 260 440 270 Z" fill="url(#hairHighlight)"/>
    <path d="M 360 290 Q 330 220 300 240 Q 330 280 360 290 Z" fill="url(#hairHighlight)"/>
    <!-- Forehead Bangs -->
    <path d="M 280 360 Q 330 420 310 460 Q 360 390 380 350 Z" fill="url(#hairBase)"/>
    <path d="M 370 330 Q 420 440 400 470 Q 440 380 460 330 Z" fill="url(#hairBase)"/>
    <path d="M 450 320 Q 500 430 490 460 Q 520 370 540 330 Z" fill="url(#hairBase)"/>
    <path d="M 530 340 Q 580 420 570 460 Q 610 370 600 350 Z" fill="url(#hairBase)"/>

    <!-- Golden Rim Light on Hair and Left Shoulder -->
    <path d="M 520 220 Q 640 320 660 520 Q 640 420 580 320 Z" fill="#fef08a" opacity="0.6"/>
    <path d="M 580 770 Q 680 840 740 1000 Q 720 880 640 820 Z" fill="#fef08a" opacity="0.45"/>

  </g>
</svg>