<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="100%" height="100%">
  <defs>
    <radialGradient id="aura_ash_thinking" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad_ash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f0e26"/>
    </linearGradient>
    <linearGradient id="skinGrad_ash" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2d4c9"/>
      <stop offset="100%" stop-color="#d4a373"/>
    </linearGradient>
    <filter id="glow_ash">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Aura -->
  <circle cx="210" cy="230" r="190" fill="url(#aura_ash_thinking)"/>

  <!-- Character Silhouette / Base Shadow -->
  <g filter="drop-shadow(0 15px 25px rgba(0,0,0,0.65))">
    
    <!-- Torso / Cloak / Garments -->
    <path d="M 80 540 C 90 410 110 340 140 310 Q 210 335 280 310 C 310 340 330 410 340 540 Z" fill="url(#bodyGrad_ash)"/>
    
    <!-- Inner Tunic & Trim Details -->
    <path d="M 160 320 L 210 420 L 260 320 Z" fill="#8b5cf6" opacity="0.85"/>
    <path d="M 140 310 L 210 440 L 280 310" stroke="#c084fc" stroke-width="3" fill="none"/>
    <line x1="210" y1="420" x2="210" y2="540" stroke="#c084fc" stroke-width="3"/>

    <!-- Neck -->
    <rect x="190" y="240" width="40" height="70" rx="8" fill="url(#skinGrad_ash)"/>

    <!-- Back Hair -->
    <path d="M 130 160 Q 210 90 290 160 Q 310 270 295 340 Q 210 370 125 340 Q 110 270 130 160 Z" fill="#4b5563"/>

    <!-- Head / Face -->
    <ellipse cx="210" cy="205" rx="55" ry="68" fill="url(#skinGrad_ash)"/>
    <!-- Chin -->
    <path d="M 160 210 Q 210 280 260 210 Z" fill="url(#skinGrad_ash)"/>

    <!-- Ears -->
    <ellipse cx="152" cy="205" rx="8" ry="14" fill="url(#skinGrad_ash)"/>
    <ellipse cx="268" cy="205" rx="8" ry="14" fill="url(#skinGrad_ash)"/>

    <!-- Front Hair / Bangs -->
    <path d="M 145 170 Q 210 110 275 170 Q 260 140 210 135 Q 160 140 145 170 Z" fill="#4b5563"/>
    <path d="M 150 165 Q 170 210 160 240 Q 185 180 190 160 Z" fill="#4b5563"/>
    <path d="M 270 165 Q 250 210 260 240 Q 235 180 230 160 Z" fill="#4b5563"/>

    <!-- Character Specific Accessories/Gear -->
    
        <!-- Rogue Cowl / Hood -->
        <path d="M 120 180 Q 210 50 300 180 Q 320 300 300 400 L 120 400 Q 100 300 120 180 Z" fill="#1e1b4b" opacity="0.95"/>
        <path d="M 140 140 Q 210 90 280 140 Q 280 220 265 250 Q 210 270 155 250 Q 140 220 140 140 Z" fill="#0f0e26"/>
        <!-- Face Shadow -->
        <path d="M 145 135 Q 210 100 275 135 Q 260 170 210 175 Q 160 170 145 135 Z" fill="#000000" opacity="0.4"/>
        <!-- Scarf / Mask -->
        <path d="M 160 235 Q 210 255 260 235 L 270 290 Q 210 320 150 290 Z" fill="#8b5cf6" opacity="0.9"/>
        <path d="M 180 260 L 240 260" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4"/>
        

    <!-- Facial Features -->
    <!-- Eyebrows -->
    <path d="M 160 165 Q 185 160 200 170" stroke="#4b5563" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M 220 172 Q 235 165 260 168" stroke="#4b5563" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Eyes -->
    <circle cx='185' cy='184' r='9' fill='#a855f7'/><circle cx='187' cy='182' r='3' fill='#ffffff'/>
    <circle cx='245' cy='184' r='9' fill='#a855f7'/><circle cx='247' cy='182' r='3' fill='#ffffff'/>

    <!-- Nose -->
    <path d="M 210 195 L 206 218 L 214 218" stroke="#a16207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6"/>

    <!-- Mouth -->
    <path d="M 195 240 Q 210 242 220 236" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#b91c1c" opacity="0.85"/>

    <!-- Emotion Visual FX -->
    <circle cx='280' cy='160' r='5' fill='#c084fc' opacity='0.7'/><circle cx='295' cy='145' r='8' fill='#c084fc' opacity='0.7'/>
  </g>
</svg>