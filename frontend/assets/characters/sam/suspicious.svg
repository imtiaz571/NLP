    <!-- Apron Straps & Brass Rings -->
    <path d="M 310 770 L 280 920 M 570 770 L 600 920" stroke="#78350f" stroke-width="12" stroke-linecap="round"/>
    <circle cx="310" cy="775" r="14" fill="url(#goldInlay)"/>
    <circle cx="570" cy="775" r="14" fill="url(#goldInlay)"/>

    <!-- Articulated Steel Mechanical Left Forearm/Hand (Viewer's Right) -->
    <path d="M 640 910 L 770 1280 L 670 1280 L 580 930 Z" fill="url(#steelArm)"/>
    <circle cx="610" cy="930" r="22" fill="url(#goldInlay)" stroke="#334155" stroke-width="4"/>
    <path d="M 630 920 L 720 1190" stroke="#f97316" stroke-width="4" opacity="0.85"/>
    <!-- Mechanical finger joints -->
    <path d="M 670 1200 L 700 1280 M 700 1200 L 730 1280 M 730 1200 L 760 1280" stroke="#cbd5e1" stroke-width="6"/>

