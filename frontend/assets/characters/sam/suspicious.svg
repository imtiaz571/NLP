    <!-- High Ponytail Tail -->
    <path d="M 580 280 Q 720 340 760 520 Q 700 480 620 360 Z" fill="#292524"/>

    <!-- Strong Athletic Face -->
    <path d="M 270 420 C 270 640 355 730 440 730 C 525 730 610 640 610 420 C 610 280 525 240 440 240 C 355 240 270 280 270 420 Z" fill="url(#skinSam)"/>

    <!-- Battle Scar Across Right Cheek -->
    <path d="M 330 490 L 390 535" stroke="#9a3412" stroke-width="4.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Soot Smudge on Left Cheek -->
    <path d="M 490 480 Q 530 465 545 505 Q 510 525 490 480 Z" fill="#1c1917" opacity="0.35"/>

    <!-- Nose -->
    <path d="M 435 435 Q 430 495 425 510 Q 440 520 455 510 Q 450 495 445 435 Z" fill="#c27847" opacity="0.65"/>

    <!-- Features -->
    
        <path d="M 310 380 Q 360 350 410 375" stroke="#270e02" stroke-width="8" stroke-linecap="round" fill="none"/>
        <path d="M 470 395 Q 520 390 570 405" stroke="#270e02" stroke-width="8" stroke-linecap="round" fill="none"/>
    
        <path d="M 325 430 Q 365 405 405 430 Q 365 455 325 430 Z" fill="#ffffff" stroke="#1c1917" stroke-width="4"/>
        <circle cx="370" cy="430" r="16" fill="#ea580c"/>
        <circle cx="370" cy="430" r="7" fill="#000000"/>
        <circle cx="365" cy="424" r="4.5" fill="#ffffff"/>
        <path d="M 480 435 Q 515 425 550 435 Q 515 448 480 435 Z" fill="#ffffff" stroke="#1c1917" stroke-width="4"/>
        <circle cx="510" cy="435" r="12" fill="#ea580c"/>
        <circle cx="510" cy="435" r="5" fill="#000000"/>
        <circle cx="507" cy="430" r="3" fill="#ffffff"/>
    
        <path d="M 380 560 Q 430 550 495 535 Q 440 575 380 560 Z" fill="#7f1d1d" stroke="#450a0a" stroke-width="3.5"/>
    

    <!-- Front Strands & Bangs -->
    <path d="M 270 360 Q 320 440 300 480 Q 350 400 370 350 Z" fill="#1c1917"/>
    <path d="M 530 350 Q 580 440 570 480 Q 610 400 600 360 Z" fill="#1c1917"/>

    <!-- Warm Forge Rim Highlight -->
    <path d="M 530 200 Q 670 340 690 580 Q 650 430 580 300 Z" fill="#fdba74" opacity="0.65"/>
  </g>
</svg>