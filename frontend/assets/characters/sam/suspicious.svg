<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1280" width="880" height="1280">
  <defs>
    <radialGradient id="rimSam" cx="70%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinSam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#c27847"/>
    </linearGradient>
    <linearGradient id="apronGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="steelArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldInlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <circle cx="500" cy="400" r="380" fill="url(#rimSam)"/>

  <g filter="url(#drop)">
    <!-- Shoulders & Dark Work Gambeson -->
    <path d="M 90 1280 C 110 980 190 840 280 770 Q 440 800 600 770 C 690 840 770 980 790 1280 Z" fill="#292524"/>
    
