<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="55%" stop-color="#0c142b"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <radialGradient id="celestialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Celestial Element (Sun or Moon) -->
    <!-- Celestial Moon with Radial Glow -->
    <circle cx="1260" cy="200" r="130" fill="url(#celestialGlow)"/>
    <circle cx="1260" cy="200" r="42" fill="#f8fafc"/>
    <circle cx="1246" cy="190" r="38" fill="#0c142b" opacity="0.85"/>

  <!-- Clouds or Twinkling Stars -->
    <!-- Twinkling Starfield -->
    <g id="starfield">
      <circle cx="140" cy="80" r="2.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="280" cy="120" r="1.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="420" cy="60" r="3.0" fill="#ffffff" opacity="0.9"/>
      <circle cx="560" cy="150" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="680" cy="90" r="2.2" fill="#ffffff" opacity="0.8"/>
      <circle cx="810" cy="50" r="2.8" fill="#ffffff" opacity="0.95"/>
      <circle cx="940" cy="130" r="1.6" fill="#ffffff" opacity="0.65"/>
      <circle cx="1060" cy="70" r="2.4" fill="#ffffff" opacity="0.85"/>
      <circle cx="1180" cy="110" r="1.8" fill="#ffffff" opacity="0.75"/>
      <circle cx="1380" cy="60" r="3.2" fill="#ffffff" opacity="0.9"/>
      <circle cx="1490" cy="140" r="2.0" fill="#ffffff" opacity="0.8"/>
      <circle cx="200" cy="210" r="1.5" fill="#ffffff" opacity="0.6"/>
      <circle cx="350" cy="240" r="2.6" fill="#ffffff" opacity="0.85"/>
      <circle cx="490" cy="190" r="1.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="620" cy="260" r="2.2" fill="#ffffff" opacity="0.8"/>
      <circle cx="760" cy="210" r="3.0" fill="#ffffff" opacity="0.95"/>
      <circle cx="880" cy="250" r="1.6" fill="#ffffff" opacity="0.65"/>
      <circle cx="1020" cy="220" r="2.4" fill="#ffffff" opacity="0.8"/>
      <circle cx="1140" cy="280" r="1.9" fill="#ffffff" opacity="0.75"/>
      <circle cx="1320" cy="240" r="2.5" fill="#ffffff" opacity="0.85"/>
      <circle cx="1450" cy="260" r="1.7" fill="#ffffff" opacity="0.7"/>
      <circle cx="100" cy="310" r="2.0" fill="#ffffff" opacity="0.75"/>
      <circle cx="460" cy="330" r="2.4" fill="#ffffff" opacity="0.85"/>
      <circle cx="900" cy="340" r="1.8" fill="#ffffff" opacity="0.7"/>
      <circle cx="1540" cy="90" r="2.6" fill="#ffffff" opacity="0.9"/>
    </g>

  <!-- Location Scenery Geometry -->
    <!-- Layer 1: Distant Misty Tree Silhouettes -->
    <path d="M 0 540 Q 150 460 300 520 T 600 480 T 900 530 T 1200 470 T 1600 520 L 1600 900 L 0 900 Z" fill="#090d16" opacity="0.45"/>

    <!-- Layer 2: Midground Pine & Oak Canopy -->
    <g fill="#030712" opacity="0.75">
      <!-- Pine 1 -->
      <polygon points="120,580 60,680 180,680"/>
      <polygon points="120,500 75,590 165,590"/>
      <polygon points="120,420 90,510 150,510"/>
      <!-- Pine 2 -->
      <polygon points="340,560 270,670 410,670"/>
      <polygon points="340,480 290,570 390,570"/>
      <!-- Oak 1 -->
      <ellipse cx="650" cy="500" rx="90" ry="110"/>
      <ellipse cx="780" cy="520" rx="80" ry="100"/>
      <!-- Pine 3 -->
      <polygon points="1100,540 1020,660 1180,660"/>
      <polygon points="1100,450 1050,550 1150,550"/>
      <!-- Oak 2 -->
      <ellipse cx="1340" cy="480" rx="100" ry="120"/>
      <ellipse cx="1460" cy="510" rx="90" ry="110"/>
    </g>

    <!-- Layer 3: Foreground Massive Ancient Trees -->
    <g fill="#022c22">
      <!-- Left Ancient Oak Trunk & Canopy -->
      <path d="M 40 900 L 90 540 Q 40 400 0 350 L 0 900 Z" fill="#14532d"/>
      <ellipse cx="140" cy="320" rx="180" ry="190"/>
      <ellipse cx="260" cy="380" rx="140" ry="150"/>
      
      <!-- Right Giant Pine Trunk & Boughs -->
      <path d="M 1480 900 L 1440 420 L 1580 900 Z" fill="#14532d"/>
      <polygon points="1440,320 1280,480 1600,480"/>
      <polygon points="1440,220 1320,360 1560,360"/>
      <polygon points="1440,120 1360,240 1520,240"/>
    </g>

    <!-- Rolling Forest Terrain -->
    <path d="M 0 710 Q 400 660 800 700 T 1600 680 L 1600 900 L 0 900 Z" fill="#020617"/>

    <!-- Mossy Fallen Log & Boulders -->
    <g id="fallen-log">
      <!-- Fallen Log in Center-Right -->
      <ellipse cx="980" cy="740" rx="160" ry="24" fill="#3f2e18" transform="rotate(-6 980 740)"/>
      <ellipse cx="830" cy="755" rx="18" ry="22" fill="#15803d"/>
      <!-- Moss patches on log -->
      <ellipse cx="940" cy="732" rx="40" ry="10" fill="#16a34a"/>
      <ellipse cx="1040" cy="735" rx="30" ry="8" fill="#16a34a"/>
      <!-- Forest Mushrooms -->
      <ellipse cx="890" cy="725" rx="8" ry="5" fill="#ef4444"/>
      <rect x="888" y="727" width="4" height="8" fill="#f8fafc"/>
      <ellipse cx="905" cy="728" rx="6" ry="4" fill="#ef4444"/>
      <!-- Mossy Boulder Left -->
      <ellipse cx="320" cy="750" rx="70" ry="40" fill="#334155"/>
      <ellipse cx="310" cy="735" rx="50" ry="22" fill="#15803d"/>
    </g>

    <!-- Undergrowth Ferns and Bushes -->
    <g fill="#15803d" opacity="0.9">
      <path d="M 180 760 Q 210 700 240 760 Z"/>
      <path d="M 200 760 Q 230 680 260 760 Z"/>
      <path d="M 680 770 Q 720 710 760 770 Z"/>
      <path d="M 1200 760 Q 1240 690 1280 760 Z"/>
      <path d="M 1230 760 Q 1270 670 1310 760 Z"/>
    </g>

    <!-- Winding Woodland Trail with Soft Light Patches -->
    <path d="M 620 900 Q 720 780 780 720 Q 840 760 920 900 Z" fill="#0f172a" opacity="0.6"/>

  <!-- Atmospheric Tint Blend Overlay -->
  <rect width="1600" height="900" fill="#1e1b4b" opacity="0.2" style="mix-blend-mode: overlay; pointer-events: none;"/>
</svg>