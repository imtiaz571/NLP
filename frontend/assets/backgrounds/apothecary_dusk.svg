<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="55%" stop-color="#9f1239"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <radialGradient id="celestialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fbbf24" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Celestial Element (Sun or Moon) -->
    <!-- Celestial Sun with Radiant Atmospheric Glow -->
    <circle cx="1340" cy="480" r="160" fill="url(#celestialGlow)"/>
    <circle cx="1340" cy="480" r="48" fill="#ffffff"/>
    <polygon points="1140,480 1540,480 1790,900 890,900" fill="#ffffff" opacity="0.04"/>
    <polygon points="1340,280 1340,680 1690,900 1190,900" fill="#ffffff" opacity="0.04"/>

  <!-- Clouds or Twinkling Stars -->
    <!-- Layered Drifting Clouds -->
    <g id="clouds" opacity="0.7">
      <path d="M 60 220 Q 120 160 200 180 Q 280 140 360 190 Q 420 170 480 210 Q 520 250 460 280 L 80 280 Z" fill="#fda4af" opacity="0.85"/>
      <path d="M 100 240 Q 180 190 280 220 Q 360 200 440 240 L 120 270 Z" fill="#c084fc" opacity="0.5"/>
      <path d="M 720 160 Q 800 100 900 130 Q 980 90 1080 140 Q 1160 110 1240 160 Q 1280 200 1200 230 L 740 230 Z" fill="#fda4af" opacity="0.8"/>
      <path d="M 760 180 Q 860 130 980 160 Q 1060 130 1180 180 L 800 210 Z" fill="#c084fc" opacity="0.45"/>
      <path d="M 1300 320 Q 1380 270 1460 290 Q 1520 260 1580 310 L 1320 340 Z" fill="#fda4af" opacity="0.6"/>
    </g>

  <!-- Location Scenery Geometry -->
    <!-- Herbalist Wall Interior -->
    <rect width="1600" height="900" fill="#0f172a"/>
    <line x1="0" y1="200" x2="1600" y2="200" stroke="#1e293b" stroke-width="4"/>
    <line x1="0" y1="400" x2="1600" y2="400" stroke="#1e293b" stroke-width="4"/>

    <!-- Heavy Ceiling Beams with Hanging Dried Herbs -->
    <g id="herb-beams">
      <rect x="0" y="0" width="1600" height="70" fill="#1e293b"/>
      <!-- Hanging Herb Bundles -->
      <!-- Lavender -->
      <path d="M 220 70 L 220 180 Q 240 220 220 250" stroke="#065f46" stroke-width="5" fill="none"/>
      <ellipse cx="220" cy="220" rx="16" ry="40" fill="#8b5cf6" opacity="0.85"/>
      <!-- Mountain Sage -->
      <path d="M 440 70 L 440 160 Q 420 200 440 230" stroke="#065f46" stroke-width="5" fill="none"/>
      <ellipse cx="440" cy="200" rx="20" ry="35" fill="#10b981" opacity="0.85"/>
      <!-- Thistle -->
      <path d="M 760 70 L 760 170 Q 780 210 760 240" stroke="#065f46" stroke-width="5" fill="none"/>
      <ellipse cx="760" cy="210" rx="18" ry="38" fill="#f59e0b" opacity="0.85"/>
      <!-- Chamomile -->
      <path d="M 1080 70 L 1080 150 Q 1060 190 1080 220" stroke="#065f46" stroke-width="5" fill="none"/>
      <ellipse cx="1080" cy="190" rx="22" ry="32" fill="#fef08a" opacity="0.85"/>
      <!-- Roots -->
      <path d="M 1360 70 L 1360 190 Q 1390 230 1360 260" stroke="#78350f" stroke-width="6" fill="none"/>
      <ellipse cx="1360" cy="230" rx="15" ry="45" fill="#92400e" opacity="0.85"/>
    </g>

    <!-- Apothecary Cabinet with Multi-Tier Shelves & Potion Jars -->
    <g id="potion-cabinet">
      <!-- Shelf Framework -->
      <rect x="80" y="240" width="1440" height="14" fill="#334155"/>
      <rect x="80" y="380" width="1440" height="14" fill="#334155"/>
      <rect x="80" y="520" width="1440" height="14" fill="#334155"/>

      <!-- Shelf 1 Jars & Alembics -->
      <g opacity="0.9">
        <rect x="140" y="160" width="35" height="80" rx="6" fill="#06b6d4"/>
        <rect x="220" y="150" width="45" height="90" rx="8" fill="#10b981"/>
        <rect x="310" y="170" width="30" height="70" rx="4" fill="#f43f5e"/>
        <circle cx="420" cy="200" r="30" fill="#a855f7"/>
        <rect x="412" y="155" width="16" height="25" fill="#334155"/>
        <!-- Ceramic specimen jars -->
        <rect x="520" y="160" width="50" height="80" rx="4" fill="#e2e8f0"/>
        <rect x="620" y="150" width="45" height="90" rx="4" fill="#cbd5e1"/>
        <rect x="720" y="165" width="40" height="75" rx="4" fill="#e2e8f0"/>
        <!-- Right side glowing flasks -->
        <circle cx="950" cy="200" r="28" fill="#eab308"/>
        <circle cx="1060" cy="195" r="34" fill="#3b82f6"/>
        <rect x="1160" y="160" width="36" height="80" rx="6" fill="#ec4899"/>
        <rect x="1260" y="150" width="44" height="90" rx="6" fill="#14b8a6"/>
        <rect x="1360" y="165" width="38" height="75" rx="6" fill="#84cc16"/>
      </g>

      <!-- Shelf 2 Jars -->
      <g opacity="0.9">
        <rect x="160" y="300" width="50" height="80" rx="6" fill="#6366f1"/>
        <circle cx="280" cy="340" r="30" fill="#10b981"/>
        <rect x="380" y="290" width="40" height="90" rx="6" fill="#f97316"/>
        <rect x="880" y="300" width="45" height="80" rx="6" fill="#06b6d4"/>
        <circle cx="1000" cy="340" r="32" fill="#a855f7"/>
        <rect x="1120" y="295" width="48" height="85" rx="6" fill="#22c55e"/>
        <rect x="1240" y="305" width="42" height="75" rx="6" fill="#ef4444"/>
      </g>
    </g>

    <!-- Foreground Herbalist Work Counter with Mortar, Scales & Alembic -->
    <g id="apothecary-counter">
      <path d="M 100 680 L 1500 680 L 1440 900 L 160 900 Z" fill="#1e293b"/>
      <rect x="80" y="660" width="1440" height="28" fill="#334155"/>
      <!-- Brass Balance Scale -->
      <line x1="380" y1="660" x2="380" y2="520" stroke="#d97706" stroke-width="8"/>
      <line x1="320" y1="540" x2="440" y2="540" stroke="#d97706" stroke-width="6"/>
      <polygon points="320,540 300,590 340,590" fill="#fbbf24"/>
      <polygon points="440,540 420,580 460,580" fill="#fbbf24"/>

      <!-- Mortar & Pestle -->
      <ellipse cx="620" cy="640" rx="40" ry="24" fill="#475569"/>
      <line x1="620" y1="640" x2="650" y2="580" stroke="#64748b" stroke-width="12"/>

      <!-- Bubbling Alembic Burner with Vapor -->
      <rect x="860" y="640" width="60" height="20" fill="#d97706"/>
      <circle cx="890" cy="600" r="35" fill="#06b6d4" opacity="0.85"/>
      <path d="M 890 570 Q 940 520 980 570 L 980 650" stroke="#38bdf8" stroke-width="8" fill="none"/>
      <!-- Glowing magical vapor -->
      <circle cx="890" cy="540" r="14" fill="#a7f3d0" opacity="0.7"/>
      <circle cx="900" cy="510" r="18" fill="#a7f3d0" opacity="0.5"/>
      <circle cx="885" cy="480" r="22" fill="#a7f3d0" opacity="0.3"/>

      <!-- Open Leather Grimoire -->
      <polygon points="1120,650 1190,620 1260,650 1260,670 1190,640 1120,670" fill="#78350f"/>
      <polygon points="1125,648 1190,622 1255,648" fill="#fef08a"/>
    </g>

  <!-- Atmospheric Tint Blend Overlay -->
  <rect width="1600" height="900" fill="#ea580c" opacity="0.15" style="mix-blend-mode: overlay; pointer-events: none;"/>
</svg>