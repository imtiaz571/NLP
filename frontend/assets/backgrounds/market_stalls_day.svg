<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <radialGradient id="celestialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="torchGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="25%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

  </defs>

  <!-- Sky Background -->
  <rect width="1600" height="900" fill="url(#skyGrad)"/>

  <!-- Celestial Element (Sun or Moon) -->
    <!-- Celestial Sun with Radiant Atmospheric Glow -->
    <circle cx="1220" cy="180" r="180" fill="url(#celestialGlow)"/>
    <circle cx="1220" cy="180" r="50" fill="#ffffff"/>
    <polygon points="1020,180 1420,180 1670,900 770,900" fill="#ffffff" opacity="0.04"/>
    <polygon points="1220,-20 1220,380 1570,900 1070,900" fill="#ffffff" opacity="0.04"/>

  <!-- Clouds or Twinkling Stars -->
    <!-- Layered Drifting Clouds -->
    <g id="clouds" opacity="0.75">
      <path d="M 60 220 Q 120 160 200 180 Q 280 140 360 190 Q 420 170 480 210 Q 520 250 460 280 L 80 280 Z" fill="#ffffff" opacity="0.85"/>
      <path d="M 100 240 Q 180 190 280 220 Q 360 200 440 240 L 120 270 Z" fill="#e0f2fe" opacity="0.5"/>
      <path d="M 720 160 Q 800 100 900 130 Q 980 90 1080 140 Q 1160 110 1240 160 Q 1280 200 1200 230 L 740 230 Z" fill="#ffffff" opacity="0.8"/>
      <path d="M 760 180 Q 860 130 980 160 Q 1060 130 1180 180 L 800 210 Z" fill="#e0f2fe" opacity="0.45"/>
      <path d="M 1300 320 Q 1380 270 1460 290 Q 1520 260 1580 310 L 1320 340 Z" fill="#ffffff" opacity="0.6"/>
    </g>

  <!-- Location Scenery Geometry -->
    <!-- Distant Village Roofs & Mountain Backing -->
    <path d="M 0 540 L 260 440 L 580 520 L 920 420 L 1260 510 L 1600 450 L 1600 900 L 0 900 Z" fill="#1e3a8a" opacity="0.5"/>
    
    <!-- Background Houses -->
    <polygon points="120,530 220,440 320,530" fill="#9a3412"/>
    <rect x="140" y="530" width="160" height="160" fill="#334155"/>
    <polygon points="1280,510 1400,420 1520,510" fill="#9a3412"/>
    <rect x="1300" y="510" width="200" height="180" fill="#334155"/>

    <!-- Overhead Market Bunting & Pennants -->
    <g id="bunting">
      <path d="M 60 420 Q 400 490 800 440 Q 1200 490 1540 420" stroke="#78350f" stroke-width="4" fill="none"/>
      <!-- Pennants -->
      <polygon points="200,445 220,485 240,448" fill="#ef4444"/>
      <polygon points="360,460 380,500 400,462" fill="#eab308"/>
      <polygon points="520,458 540,498 560,456" fill="#10b981"/>
      <polygon points="680,448 700,488 720,446" fill="#3b82f6"/>
      <polygon points="880,448 900,488 920,450" fill="#ec4899"/>
      <polygon points="1040,460 1060,500 1080,462" fill="#8b5cf6"/>
      <polygon points="1200,458 1220,498 1240,455" fill="#f97316"/>
      <polygon points="1360,442 1380,482 1400,438" fill="#10b981"/>
    </g>

    <!-- Market Stall 1 (Left: Fruit & Produce Stall with Burgundy/White Canopy) -->
    <g id="stall-left">
      <!-- Wooden Frame Structure -->
      <rect x="80" y="440" width="380" height="280" fill="#1e293b"/>
      <line x1="80" y1="440" x2="80" y2="760" stroke="#451a03" stroke-width="12"/>
      <line x1="460" y1="440" x2="460" y2="760" stroke="#451a03" stroke-width="12"/>
      <!-- Striped Awning -->
      <path d="M 60 440 L 480 440 L 460 520 L 40 520 Z" fill="#991b1b"/>
      <polygon points="120,440 180,440 170,520 110,520" fill="#f8fafc"/>
      <polygon points="240,440 300,440 290,520 230,520" fill="#f8fafc"/>
      <polygon points="360,440 420,440 410,520 350,520" fill="#f8fafc"/>
      <!-- Scalloped Awning Fringe -->
      <path d="M 40 520 Q 60 535 80 520 Q 100 535 120 520 Q 140 535 160 520 Q 180 535 200 520 Q 220 535 240 520 Q 260 535 280 520 Q 300 535 320 520 Q 340 535 360 520 Q 380 535 400 520 Q 420 535 440 520 Q 460 535 480 520" fill="#991b1b"/>
      <!-- Stall Counter Table -->
      <rect x="70" y="620" width="400" height="25" fill="#5c2b09"/>
      <!-- Crates of Red Apples & Veggies -->
      <rect x="100" y="580" width="80" height="40" fill="#78350f"/>
      <circle cx="120" cy="575" r="10" fill="#ef4444"/>
      <circle cx="140" cy="575" r="10" fill="#ef4444"/>
      <circle cx="160" cy="575" r="10" fill="#ef4444"/>
      <!-- Green Gourd Crate -->
      <rect x="200" y="580" width="80" height="40" fill="#78350f"/>
      <ellipse cx="225" cy="575" rx="12" ry="8" fill="#16a34a"/>
      <ellipse cx="255" cy="575" rx="12" ry="8" fill="#16a34a"/>
      <!-- Grain Sack -->
      <ellipse cx="330" cy="600" rx="30" ry="25" fill="#fde68a"/>
      <ellipse cx="390" cy="600" rx="25" ry="22" fill="#fed7aa"/>
    </g>

    <!-- Market Stall 2 (Center: Potions, Trinkets & Spices with Emerald/Gold Canopy) -->
    <g id="stall-center">
      <rect x="580" y="420" width="440" height="300" fill="#1e293b"/>
      <line x1="580" y1="420" x2="580" y2="760" stroke="#451a03" stroke-width="12"/>
      <line x1="1020" y1="420" x2="1020" y2="760" stroke="#451a03" stroke-width="12"/>
      <!-- Striped Canopy -->
      <path d="M 560 420 L 1040 420 L 1020 500 L 540 500 Z" fill="#065f46"/>
      <polygon points="620,420 680,420 670,500 610,500" fill="#fbbf24"/>
      <polygon points="740,420 800,420 790,500 730,500" fill="#fbbf24"/>
      <polygon points="860,420 920,420 910,500 850,500" fill="#fbbf24"/>
      <!-- Fringe -->
      <path d="M 540 500 Q 565 515 590 500 Q 615 515 640 500 Q 665 515 690 500 Q 715 515 740 500 Q 765 515 790 500 Q 815 515 840 500 Q 865 515 890 500 Q 915 515 940 500 Q 965 515 990 500 Q 1015 515 1040 500" fill="#065f46"/>
      <!-- Counter -->
      <rect x="570" y="610" width="460" height="25" fill="#5c2b09"/>
      <!-- Hanging Garlic & Dried Herbs from Stall Ceiling -->
      <path d="M 640 460 L 640 550" stroke="#ffffff" stroke-width="4"/>
      <circle cx="640" cy="540" r="10" fill="#f8fafc"/>
      <circle cx="640" cy="520" r="9" fill="#f8fafc"/>
      <path d="M 960 460 L 960 560" stroke="#b91c1c" stroke-width="4"/>
      <ellipse cx="960" cy="550" rx="8" ry="14" fill="#dc2626"/>
      <!-- Spice Jars and Amphorae -->
      <rect x="620" y="560" width="25" height="50" rx="4" fill="#d97706"/>
      <rect x="660" y="550" width="30" height="60" rx="4" fill="#0284c7"/>
      <ellipse cx="740" cy="580" rx="25" ry="30" fill="#b45309"/>
      <ellipse cx="860" cy="580" rx="25" ry="30" fill="#b45309"/>
    </g>

    <!-- Market Stall 3 (Right: Baker & Bread Stall with Royal Navy/Amber Canopy) -->
    <g id="stall-right">
      <rect x="1140" y="440" width="380" height="280" fill="#1e293b"/>
      <line x1="1140" y1="440" x2="1140" y2="760" stroke="#451a03" stroke-width="12"/>
      <line x1="1520" y1="440" x2="1520" y2="760" stroke="#451a03" stroke-width="12"/>
      <!-- Canopy -->
      <path d="M 1120 440 L 1540 440 L 1520 520 L 1100 520 Z" fill="#1e3a8a"/>
      <polygon points="1180,440 1240,440 1230,520 1170,520" fill="#f59e0b"/>
      <polygon points="1300,440 1360,440 1350,520 1290,520" fill="#f59e0b"/>
      <polygon points="1420,440 1480,440 1470,520 1410,520" fill="#f59e0b"/>
      <!-- Counter -->
      <rect x="1130" y="620" width="400" height="25" fill="#5c2b09"/>
      <!-- Bread Loaves and Pies -->
      <ellipse cx="1200" cy="610" rx="35" ry="18" fill="#d97706"/>
      <ellipse cx="1280" cy="608" rx="30" ry="16" fill="#b45309"/>
      <ellipse cx="1360" cy="612" rx="38" ry="18" fill="#f59e0b"/>
      <ellipse cx="1440" cy="610" rx="28" ry="15" fill="#d97706"/>
    </g>

    <!-- Foreground Wooden Hand Cart & Wheel -->
    <g id="hand-cart">
      <ellipse cx="520" cy="770" rx="45" ry="45" fill="none" stroke="#78350f" stroke-width="10"/>
      <circle cx="520" cy="770" r="12" fill="#451a03"/>
      <line x1="520" y1="725" x2="520" y2="815" stroke="#78350f" stroke-width="6"/>
      <line x1="475" y1="770" x2="565" y2="770" stroke="#78350f" stroke-width="6"/>
    </g>

    <!-- Cobblestone Market Square Ground -->
    <path d="M 0 740 Q 800 690 1600 740 L 1600 900 L 0 900 Z" fill="#0f172a"/>

  <!-- Atmospheric Tint Blend Overlay -->
  <rect width="1600" height="900" fill="#38bdf8" opacity="0.08" style="mix-blend-mode: overlay; pointer-events: none;"/>
</svg>